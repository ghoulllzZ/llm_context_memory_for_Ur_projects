<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capture</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup-shell">
    <p class="eyebrow">Local capture</p>
    <h1>Conversation Capture</h1>
    <label>
      <span>Backend URL</span>
      <input id="backendUrl" type="url" value="http://127.0.0.1:8765" />
    </label>
    <button id="captureButton">Capture Current Conversation</button>
    <button id="openDashboardButton" class="secondary">Open Dashboard</button>
    <pre id="statusBox">Ready.</pre>
  </main>
  <script src="popup.js" defer></script>
</body>
</html>
